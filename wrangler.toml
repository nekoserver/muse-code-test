# muse-code-test-n — ultra-light Worker (no container, no agent).
#
# Muse execution does not live here: it is handled by muse-code-wasm
# (a Worker-side WASM Tailscale node POSTs to a receiver on muse-vm, and
# the receiver itself serves the HTTP endpoint — no standalone web server
# and no Cloudflare container are required on that route either).
# This Worker exists to prove the rebuilt project deploys cleanly.

name = "muse-code-test-n"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true
